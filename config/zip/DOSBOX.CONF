# Dreams to Reality (DOS, 3dfx): DOSBox Pure reads this file from inside the zip (core option "Loading of
# dosbox.conf" = "Try 'dosbox.conf' in the loaded content"). DREAMSFX.EXE is DOS/4GW with Glide 2 from
# GLIDE2X.OVL (3dfx's 2.42 Voodoo Graphics DOS driver from the disc's own 3DFX\GRTVGR.EXE kit), so the Voodoo 1
# is on, rendered at 2x. 32 MB: INSTALFX.BAT asks for 20 MB of RAM.
# Sound Blaster 16 at 220 / IRQ 7 / DMA 1 / 5, as SETSOUND.EXE (Miles) wrote DATA\SOUND\DIG.INI.
# Music = the CD's audio tracks (both CD images are in the zip; D: starts on CD 1). 200000 cycles
# (a fast Pentium): measured headless, the 3D frame rate roughly doubles from 77000 to 150000, and the
# 640x480 movies are decoded by the CPU.
[cpu]
core=auto
cputype=pentium_slow
cycles=200000
[dosbox]
memsize=32
machine=svga_s3
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
[pci]
voodoo=4mb
voodoo_perf=4
voodoo_scale=2
voodoo_gamma=-2
