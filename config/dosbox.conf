# Dreams to Reality (Cryo, 1997), DOS 3dfx version, for DOSBox Staging 0.82 or newer (written by build.py).
# Start DOSBox Staging in this folder: dosbox --working-dir "<this folder>" (see README.md).
# DREAMSFX.EXE is DOS/4GW with Glide 2 from GLIDE2X.OVL (3dfx's 2.42 Voodoo Graphics DOS driver from CD 1),
# so the emulated Voodoo 1 is on. 32 MB: the 3dfx installer asks for 20 MB. Sound Blaster 16 at 220 / IRQ 7 /
# DMA 1 / 5, as the game's SETSOUND.EXE wrote DATA\SOUND\DIG.INI. Music = the CDs' audio tracks.
# 200000 cycles (a fast Pentium): the 3D frame rate roughly doubles from 77000 to 150000, and the 640x480
# movies are decoded by the CPU. If it stutters, try cpu_cycles_protected = max.
[dosbox]
machine = svga_s3
memsize = 32

[cpu]
core = auto
cputype = pentium
cpu_cycles_protected = 200000

[voodoo]
voodoo = on
voodoo_memsize = 4
voodoo_bilinear_filtering = on

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
mount c drive_c
rem CD 1 (and CD 2): when the game asks for the other CD, press Ctrl+F4 to swap discs
imgmount d @CDS@ -t cdrom
call c:\CRYO\DREAMS\GO.BAT
exit
